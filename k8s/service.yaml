apiVersion: v1
kind: Service
metadata:
  name: poison-detector
  namespace: poison-detector
  labels:
    app: poison-detector
    component: api
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: api
  annotations:
    app.kubernetes.io/description: "Internal ClusterIP service for poison-detector API"
spec:
  type: ClusterIP
  selector:
    app: poison-detector
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: poison-detector-external
  namespace: poison-detector
  labels:
    app: poison-detector
    component: api
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:REGION:ACCOUNT:certificate/CERTIFICATE_ID"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  selector:
    app: poison-detector
    component: api
  ports:
    - name: https
      port: 443
      targetPort: 8000
      protocol: TCP
