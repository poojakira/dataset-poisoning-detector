apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poison-detector
  namespace: poison-detector
  labels:
    app: poison-detector
    component: api
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poison-detector
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: poison_detector_scoring_latency_seconds
        target:
          type: AverageValue
          averageValue: "500m"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
