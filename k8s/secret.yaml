apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: poison-detector-secrets
  namespace: poison-detector
  labels:
    app: poison-detector
    component: secrets
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: poison-detector-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: poison-detector
          component: secrets
  data:
    - secretKey: POISON_JWT_SIGNING_KEY
      remoteRef:
        key: poison-detector/production/jwt-signing-key
        property: value
    - secretKey: POISON_API_KEY
      remoteRef:
        key: poison-detector/production/api-keys
        property: primary
    - secretKey: POISON_REDIS_AUTH_TOKEN
      remoteRef:
        key: poison-detector/production/redis
        property: auth-token
    - secretKey: POISON_DATABASE_URL
      remoteRef:
        key: poison-detector/production/database
        property: url
