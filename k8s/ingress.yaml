apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poison-detector
  namespace: poison-detector
  labels:
    app: poison-detector
    component: ingress
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:REGION:ACCOUNT:certificate/CERTIFICATE_ID"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:REGION:ACCOUNT:regional/webacl/poison-detector-waf/WAF_ID"
    alb.ingress.kubernetes.io/load-balancer-attributes: "routing.http.drop_invalid_header_fields.enabled=true"
    alb.ingress.kubernetes.io/actions.rate-limit: |
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"application/json","statusCode":"429","messageBody":"{\"error\":\"rate_limit_exceeded\"}"}}
    alb.ingress.kubernetes.io/conditions.rate-limit: |
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Rate-Limited","values":["true"]}}]
    alb.ingress.kubernetes.io/cors-allow-origin: "https://*.example.com"
    alb.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    alb.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID"
    alb.ingress.kubernetes.io/cors-max-age: "3600"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - poison-detector.example.com
      secretName: poison-detector-tls
  rules:
    - host: poison-detector.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poison-detector
                port:
                  number: 8000
