apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: poison-detector-default-deny
  namespace: poison-detector
  labels:
    app: poison-detector
    component: network-policy
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: poison-detector
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: poison-detector-allow-ingress
  namespace: poison-detector
  labels:
    app: poison-detector
    component: network-policy
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: poison-detector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/component: ingress-controller
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: poison-detector-allow-egress
  namespace: poison-detector
  labels:
    app: poison-detector
    component: network-policy
    version: v1
    app.kubernetes.io/name: poison-detector
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: poison-detector
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
