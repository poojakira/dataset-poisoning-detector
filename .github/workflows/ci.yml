name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.4"
  PYRIGHT_VERSION: "1.1.388"
  BANDIT_VERSION: "1.8.3"
  PIP_AUDIT_VERSION: "2.10.1"
  CYCLONEDX_VERSION: "5.1.1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint and package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==${{ env.RUFF_VERSION }} pyright==${{ env.PYRIGHT_VERSION }}
          pip install -e ".[dev,realtime,kafka]"
          pip install boto3

      - run: ruff check src/poison_detector tests --output-format=github

      - run: ruff format --check src/poison_detector tests

      - run: pyright src/poison_detector tests

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout attack-v19-core (optional)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: poojakira/attack-v19-core
          path: attack-v19-core
          token: ${{ secrets.ATTACK_CORE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -d "attack-v19-core" ]; then
            pip install -e ./attack-v19-core
            pip install -e ".[dev,attack]"
          else
            pip install -e ".[dev]"
          fi

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short \
            --cov=poison_detector \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=45 \
            -W error::DeprecationWarning \
            -W error::PendingDeprecationWarning

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      - name: Verify test collection
        run: |
          count=$(PYTHONPATH=src python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests)')
          count=${count:-0}
          if [ "$count" -lt 5 ]; then
            echo "Expected at least 5 tests collected, got $count"
            exit 1
          fi
          echo "Collected $count tests"

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"