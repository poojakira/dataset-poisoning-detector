[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-poisoning-detector"
version = "0.2.0"
description = "Detect poisoned training samples before they corrupt your model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "poojakira"}
]
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]
realtime = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "websockets>=12.0",
    "pyyaml>=6.0",
]
kafka = [
    "aiokafka>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "ERA", # eradicate
    "PL",  # pylint
    "Q",   # pyflakes-quotes
]
ignore = [
    "S101",   # assert used in test code
    "T201",   # print in test code
    "ARG001", # unused argument in test fixtures
    "ARG002", # unused argument in test fixtures
    "N803",   # argument name should be lowercase (X is standard ML notation)
    "N806",   # variable in function should be lowercase (X is standard ML notation)
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["attack_mapping", "poison_detector"]