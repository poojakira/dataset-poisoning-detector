[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-poisoning-detector"
version = "0.2.0"
description = "Detect poisoned training samples before they corrupt your model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "poojakira"}
]
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
realtime = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "websockets>=12.0",
    "pyyaml>=6.0",
]
kafka = [
    "aiokafka>=0.10",
]
attack = ["attack-v19-core>=19.1,<20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = [
    "N803",
    "N806",
    "W293",
    "B008",
    "B007",
    "B904",
    "B905",
    "I001",
    "E501",
    "F841",
    "F401",
    "E402",
]