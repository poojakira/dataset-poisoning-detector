[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-poisoning-detector"
version = "0.2.0"
description = "Detect poisoned training samples before they corrupt your model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "poojakira"}
]
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "attack-v19-core>=19.1,<20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
realtime = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "websockets>=12.0",
    "pyyaml>=6.0",
]
kafka = [
    "aiokafka>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "B"]
ignore = [
    "N803",  # ML convention: X for feature matrix
    "N806",  # ML convention: X for feature matrix
    "W293",  # blank line whitespace
    "B008",  # function call in default arg
    "B007",  # loop control variable not used
    "B904",  # raise from - some are intentional
    "B905",  # zip without strict
    "I001",  # import sorting - needs fix
    "E501",  # line too long - some exceed
    "F841",  # unused local variable - some intentional
    "F401",  # unused imports - needs fix
    "E402",  # module level import not at top - test fixture
]